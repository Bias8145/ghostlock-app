name: Complete UI Hardening

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Validate and apply safe UI hardening
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          main = Path('app/src/main/java/com/ghostlock/app/MainActivity.java')
          s = main.read_text()

          # Migrate the existing scale preference to an app-only density override.
          s = s.replace('private static final String PREF_FONT_SCALE = "font_scale";',
                        'private static final String PREF_APP_SCALE = "app_scale";\n'
                        '    private static final String PREF_LEGACY_FONT_SCALE = "font_scale";')
          pattern = re.compile(r'    @Override\n    protected void attachBaseContext\(android\\.content\\.Context base\) \{.*?\n    \}\n', re.S)
          replacement = '''    @Override
    protected void attachBaseContext(android.content.Context base) {
        android.content.SharedPreferences prefs = base.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
        float scale = prefs.getFloat(PREF_APP_SCALE, Float.NaN);
        if (Float.isNaN(scale)) scale = prefs.getFloat(PREF_LEGACY_FONT_SCALE, 1.0f);
        if (!Float.isFinite(scale)) scale = 1.0f;
        scale = Math.max(0.80f, Math.min(1.30f, scale));
        Configuration configuration = new Configuration(base.getResources().getConfiguration());
        configuration.densityDpi = Math.max(120, Math.round(configuration.densityDpi * scale));
        super.attachBaseContext(base.createConfigurationContext(configuration));
    }
'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1 or 'configuration.fontScale = scale;' in s:
              raise SystemExit('unsafe scale migration: refusing commit')
          main.write_text(s)

          layout = Path('app/src/main/res/layout/activity_main.xml')
          if layout.exists():
              t = layout.read_text()
              t = t.replace('android:id="@+id/fontSizeSpinner"', 'android:id="@+id/appScaleSpinner"')
              layout.write_text(t)

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','app/src/main/java/com/ghostlock/app/MainActivity.java','app/src/main/res/layout/activity_main.xml'], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              raise SystemExit(0)
          subprocess.run(['git','commit','-m','feat: complete app scale and UI hardening'], check=True)
          subprocess.run(['git','push','origin','HEAD:Test'], check=True)
