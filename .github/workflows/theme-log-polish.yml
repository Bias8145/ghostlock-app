name: Theme Log Polish

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Add theme-aware log resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel, values in {
            'app/src/main/res/values/colors.xml': {
              'log_bg':'#F0F0F3','log_title':'#222228','log_text':'#303038','log_secondary':'#686872','log_divider':'#DADAE0'},
            'app/src/main/res/values-night/colors.xml': {
              'log_bg':'#FF171916','log_title':'#FFE4E3DD','log_text':'#FFD7D8D1','log_secondary':'#FFBFC1BA','log_divider':'#668D8E87'}
          }.items():
            p=Path(rel); s=p.read_text()
            import re
            for name,val in values.items():
              pat=rf'<color name="{re.escape(name)}">.*?</color>'
              line=f'<color name="{name}">{val}</color>'
              if re.search(pat,s): s=re.sub(pat,line,s, count=1)
              else: s=s.replace('</resources>',f'    {line}\n</resources>')
            p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values/colors.xml app/src/main/res/values-night/colors.xml
          git diff --cached --quiet && exit 0
          git commit -m "ui: polish theme-aware log colors"
          git push origin HEAD:Test
