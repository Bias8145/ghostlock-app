name: Repair MainActivity build errors

on:
  push:
    branches:
      - Test

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Test
        uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0

      - name: Apply Java compile fixes
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/com/ghostlock/app/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/ghostlock/app/MainActivity.java")
          s = p.read_text()

          if "import android.content.Context;" not in s:
              s = s.replace("import android.content.ClipData;", "import android.content.Context;\nimport android.content.ClipData;", 1)

          if "private View runtimeStatus;" not in s:
              s = s.replace("    private TextView deviceInfo;\n", "    private TextView deviceInfo;\n    private View runtimeStatus;\n", 1)

          if "runtimeStatus = findViewById(R.id.runtimeStatus);" not in s:
              s = s.replace("        deviceInfo = findViewById(R.id.deviceInfo);\n", "        deviceInfo = findViewById(R.id.deviceInfo);\n        runtimeStatus = findViewById(R.id.runtimeStatus);\n", 1)

          old = "advancedPanel.post(() -> rootView.findViewById(R.id.contentScroll).smoothScrollTo(0, advancedPanel.getTop()));"
          new = "advancedPanel.post(() -> ((androidx.core.widget.NestedScrollView) rootView.findViewById(R.id.contentScroll)).smoothScrollTo(0, advancedPanel.getTop()));"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-mainactivity-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostlock/app/MainActivity.java .github/workflows/repair-mainactivity-build.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: repair MainActivity compile errors"
          git push origin HEAD:Test
