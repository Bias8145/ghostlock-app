name: Final Build

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo 'gradlew not present; repository build configuration requires inspection.'
            exit 1
          fi
