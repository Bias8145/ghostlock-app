name: finalize-ui
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.pull_request.title, 'UI finalize') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final UI corrections
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/ghostlock/app/MainActivity.java')
          s = main.read_text()
          s = s.replace('            setPanelBlur(opening);\n', '')
          s = s.replace('''    private void setPanelBlur(boolean enabled) {
        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) return;
        RenderEffect effect = enabled ? RenderEffect.createBlurEffect(8f, 8f, Shader.TileMode.CLAMP) : null;
        logScroll.setRenderEffect(effect);
        deviceInfo.setRenderEffect(effect);
        runtimeStatus.setRenderEffect(effect);
    }
''', '''    /** Blur intentionally disabled for the final crisp redesign interaction. */
    private void setPanelBlur(boolean enabled) {
        // No-op.
    }
''')
          s = s.replace('import android.graphics.RenderEffect;\n', '')
          s = s.replace('import android.graphics.Shader;\n', '')
          old_clear = '''        com.google.android.material.button.MaterialButton clear = new com.google.android.material.button.MaterialButton(this);
        clear.setText("Clear history");
        clear.setAllCaps(false);
        clear.setOnClickListener(v -> { getSharedPreferences(PREFS, MODE_PRIVATE).edit().remove("run_history").apply(); refreshHistory(); });
        historyScroll.addView(historyBody);
        pageHost.addView(historyScroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
        FrameLayout.LayoutParams clearLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(48));
        clearLp.gravity = android.view.Gravity.END | android.view.Gravity.BOTTOM;
        clearLp.setMargins(0, 0, dp(16), dp(16));
        clear.setLayoutParams(clearLp);
        clear.setElevation(dp(4));
        pageHost.addView(clear);
'''
          if old_clear not in s: raise SystemExit('legacy clear-history block not found')
          s = s.replace(old_clear, '''        historyScroll.addView(historyBody);
        pageHost.addView(historyScroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
''', 1)
          old_show = '''        settingsPage.setVisibility(page == 2 ? View.VISIBLE : View.GONE);
        com.google.android.material.button.MaterialButton home = findViewById(R.id.navHome);
'''
          if old_show not in s: raise SystemExit('showPage anchor not found')
          s = s.replace(old_show, '''        settingsPage.setVisibility(page == 2 ? View.VISIBLE : View.GONE);
        View clearHistory = findViewById(R.id.clearHistoryButton);
        if (clearHistory != null) clearHistory.setVisibility(page == 1 ? View.VISIBLE : View.GONE);
        com.google.android.material.button.MaterialButton home = findViewById(R.id.navHome);
''', 1)
          main.write_text(s)
          history = Path('app/src/main/java/com/ghostlock/app/HistoryClearButton.java')
          h = history.read_text().replace('setIconSize(dp(22));', 'setIconSize(dp(24));').replace('setPadding(dp(10), dp(10), dp(10), dp(10));', 'setPadding(dp(11), dp(11), dp(11), dp(11));')
          history.write_text(h)
          Path('.github/workflows/ui-finalize.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostlock/app/MainActivity.java app/src/main/java/com/ghostlock/app/HistoryClearButton.java .github/workflows/ui-finalize.yml
          git commit -m "ui: finalize history visibility and remove blur" || exit 0
          git push origin "$BRANCH"
