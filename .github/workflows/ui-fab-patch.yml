name: UI FAB patch
on:
  push:
    branches: [Test]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply floating tools UI
        shell: python
        run: |
          from pathlib import Path
          import re

          layout = Path('app/src/main/res/layout/activity_main.xml')
          s = layout.read_text()

          # Hide the old expandable Tools section; its existing buttons remain as
          # compatibility targets for the already-tested Java actions.
          s = re.sub(r'\n\s*<com\.ghostlock\.app\.CollapsibleToolsLayout[\s\S]*?</com\.ghostlock\.app\.CollapsibleToolsLayout>', '\n        <com.ghostlock.app.CollapsibleToolsLayout android:visibility="gone" android:layout_width="1dp" android:layout_height="1dp">\n            <com.google.android.material.button.MaterialButton android:id="@+id/importButton" android:layout_width="1dp" android:layout_height="1dp" />\n        </com.ghostlock.app.CollapsibleToolsLayout>', s, count=1)

          # Add the compact FAB menu immediately above Run, aligned to the right.
          marker = '<com.ghostlock.app.ConfirmRunButton android:id="@+id/runButton"'
          start = s.index(marker)
          end = s.index('/>', start) + 2
          run_tag = s[start:end]
          replacement = '''<LinearLayout
                    android:id="@+id/toolsFabMenu"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_gravity="end|bottom"
                    android:layout_marginEnd="4dp"
                    android:layout_marginBottom="70dp"
                    android:gravity="end"
                    android:orientation="vertical"
                    android:clipChildren="false"
                    android:clipToPadding="false">
                    <ImageButton android:id="@+id/toolExport" android:layout_width="46dp" android:layout_height="46dp" android:layout_marginBottom="8dp" android:background="@drawable/bg_fab" android:contentDescription="Export offsets.json" android:padding="11dp" android:src="@drawable/ic_export" android:tint="@color/icon_tint" android:visibility="gone" />
                    <ImageButton android:id="@+id/toolParseBoot" android:layout_width="46dp" android:layout_height="46dp" android:layout_marginBottom="8dp" android:background="@drawable/bg_fab" android:contentDescription="Parse Boot" android:padding="11dp" android:src="@drawable/ic_parse_boot" android:tint="@color/icon_tint" android:visibility="gone" />
                    <ImageButton android:id="@+id/toolParseLink" android:layout_width="46dp" android:layout_height="46dp" android:layout_marginBottom="8dp" android:background="@drawable/bg_fab" android:contentDescription="Parse Link" android:padding="11dp" android:src="@drawable/ic_link" android:tint="@color/icon_tint" android:visibility="gone" />
                    <ImageButton android:id="@+id/toolImport" android:layout_width="46dp" android:layout_height="46dp" android:layout_marginBottom="8dp" android:background="@drawable/bg_fab" android:contentDescription="Import offsets" android:padding="11dp" android:src="@drawable/ic_import" android:tint="@color/icon_tint" android:visibility="gone" />
                    <ImageButton android:id="@+id/toolsFab" android:layout_width="52dp" android:layout_height="52dp" android:background="@drawable/bg_fab" android:contentDescription="Tools" android:padding="13dp" android:src="@drawable/ic_tools" android:tint="@color/icon_tint" android:elevation="12dp" />
                </LinearLayout>
                ''' + run_tag
          s = s[:start] + replacement + s[end:]
          layout.write_text(s)

          java = Path('app/src/main/java/com/ghostlock/app/MainActivity.java')
          j = java.read_text()
          j = j.replace('import android.os.Build;\nimport android.os.Bundle;\nimport android.os.Build;', 'import android.os.Build;\nimport android.os.Bundle;')
          old = '''        advancedButton.setOnClickListener(this::showActionsMenu);\n        copyButton.setOnClickListener(v -> copyLogs());\n        importButton.setOnClickListener(v -> importOffsets());\n        otaButton.setOnClickListener(v -> promptParseUrl());\n        parseButton.setOnClickListener(v -> parseOffsets());\n        exportButton.setOnClickListener(v -> exportOffsets());'''
          new = '''        advancedButton.setVisibility(View.GONE);\n        advancedButton.setOnClickListener(null);\n        copyButton.setOnClickListener(v -> copyLogs());\n        importButton.setOnClickListener(v -> importOffsets());\n        otaButton.setOnClickListener(v -> promptParseUrl());\n        parseButton.setOnClickListener(v -> parseOffsets());\n        exportButton.setOnClickListener(v -> exportOffsets());\n\n        ImageButton toolsFab = findViewById(R.id.toolsFab);\n        ImageButton toolImport = findViewById(R.id.toolImport);\n        ImageButton toolParseLink = findViewById(R.id.toolParseLink);\n        ImageButton toolParseBoot = findViewById(R.id.toolParseBoot);\n        ImageButton toolExport = findViewById(R.id.toolExport);\n        View[] toolItems = {toolImport, toolParseLink, toolParseBoot, toolExport};\n        toolsFab.setOnClickListener(v -> {\n            boolean opening = toolItems[0].getVisibility() != View.VISIBLE;\n            toolsFab.setImageResource(opening ? R.drawable.ic_close : R.drawable.ic_tools);\n            for (int i = 0; i < toolItems.length; i++) {\n                View item = toolItems[i];\n                if (opening) {\n                    item.setVisibility(View.VISIBLE);\n                    item.setAlpha(0f);\n                    item.setTranslationY(18f);\n                    item.animate().alpha(1f).translationY(0f).setDuration(140L + i * 25L).start();\n                } else {\n                    item.animate().alpha(0f).translationY(18f).setDuration(100L).withEndAction(() -> item.setVisibility(View.GONE)).start();\n                }\n            }\n        });\n        toolImport.setOnClickListener(v -> importButton.performClick());\n        toolParseLink.setOnClickListener(v -> otaButton.performClick());\n        toolParseBoot.setOnClickListener(v -> parseButton.performClick());\n        toolExport.setOnClickListener(v -> exportButton.performClick());'''
          if old not in j:
              raise SystemExit('expected Java listener block not found')
          j = j.replace(old, new, 1)
          java.write_text(j)
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ui-fab-patch.yml
          git add app/src/main/res/layout/activity_main.xml app/src/main/java/com/ghostlock/app/MainActivity.java app/src/main/res/drawable .github/workflows/ui-fab-patch.yml
          git commit -m 'ui: replace expandable tools with floating action menu'
          git push
