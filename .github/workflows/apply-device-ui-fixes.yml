name: Apply device UI fixes

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Apply reported UI fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          layout = Path('app/src/main/res/layout/activity_main.xml')
          s = layout.read_text()

          # Header theme control: restore it to the Home header and keep Settings clean.
          s = s.replace('<com.ghostlock.app.ThemeToggleButton android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone"/>',
                        '<com.ghostlock.app.ThemeToggleButton android:id="@+id/headerThemeToggle" android:layout_width="52dp" android:layout_height="52dp" android:layout_marginStart="6dp" android:contentDescription="@string/theme_toggle" android:background="@android:color/transparent" />')
          s = s.replace('<com.ghostlock.app.ThemeToggleButton android:id="@+id/settingsThemeToggle" android:layout_width="52dp" android:layout_height="52dp" android:contentDescription="@string/theme_toggle" android:background="@android:color/transparent" />',
                        '<com.ghostlock.app.ThemeToggleButton android:id="@+id/settingsThemeToggle" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />')

          # Give the scrollable content enough bottom clearance for the floating nav.
          s = s.replace('android:paddingBottom="16dp">', 'android:paddingBottom="112dp">', 1)
          s = s.replace('android:paddingBottom="150dp" android:scrollbars="vertical"',
                        'android:paddingBottom="190dp" android:scrollbars="vertical"', 1)

          # Restore a real visible Run action instead of the hidden compatibility placeholder.
          s = s.replace('<com.google.android.material.button.MaterialButton android:id="@+id/runButton" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />',
                        '<com.google.android.material.button.MaterialButton android:id="@+id/runButton" android:layout_width="56dp" android:layout_height="56dp" android:layout_gravity="end" android:layout_marginEnd="8dp" android:layout_marginBottom="12dp" android:contentDescription="@string/action_run" android:text="@string/action_run" android:textAllCaps="false" android:icon="@drawable/ic_run" android:iconGravity="textStart" android:iconPadding="6dp" app:cornerRadius="18dp" />')

          # Navbar is icon-only: remove text and use a safe icon-top layout.
          for name in ('nav_home', 'nav_history', 'nav_settings'):
              pass
          s = s.replace('app:iconGravity="textTop"', 'app:iconGravity="top"')
          s = s.replace('android:text="@string/nav_home"', 'android:text=""')
          s = s.replace('android:text="@string/nav_history"', 'android:text=""')
          s = s.replace('android:text="@string/nav_settings"', 'android:text=""')
          s = s.replace('android:layout_height="56dp" android:layout_weight="1" android:minHeight="56dp"',
                        'android:layout_height="60dp" android:layout_weight="1" android:minHeight="60dp"', 3)

          # Tool descriptions are controlled by MainActivity; hide all labels by default.
          s = s.replace('<TextView android:layout_width="wrap_content" android:layout_height="36dp"',
                        '<TextView android:visibility="gone" android:layout_width="wrap_content" android:layout_height="36dp"')
          layout.write_text(s)

          main = Path('app/src/main/java/com/ghostlock/app/MainActivity.java')
          m = main.read_text()
          old = '''        home.setText("Home");
        history.setText("History");
        settings.setText("Settings");'''
          m = m.replace(old, '''        home.setText("");
        history.setText("");
        settings.setText("");''')

          old_tools = '''        toolsFab.setOnClickListener(v -> {
            boolean opening = toolItems[0].getVisibility() != View.VISIBLE;
            toolsFab.setImageResource(opening ? R.drawable.ic_close : R.drawable.ic_tools);
            for (int i = 0; i < toolItems.length; i++) {
                View item = toolItems[i];
                if (opening) {
                    item.setVisibility(View.VISIBLE);
                    item.setAlpha(0f);
                    item.setTranslationY(18f);
                    item.animate().alpha(1f).translationY(0f).setDuration(140L + i * 25L).start();
                } else {
                    item.animate().alpha(0f).translationY(18f).setDuration(100L).withEndAction(() -> item.setVisibility(View.GONE)).start();
                }
            }
        });'''
          new_tools = '''        toolsFab.setOnClickListener(v -> {
            boolean opening = toolItems[0].getVisibility() != View.VISIBLE;
            toolsFab.setImageResource(opening ? R.drawable.ic_close : R.drawable.ic_tools);
            ViewGroup menu = findViewById(R.id.toolsFabMenu);
            for (int i = 0; i < toolItems.length; i++) {
                View item = toolItems[i];
                View label = (menu != null && i < menu.getChildCount()) ? ((ViewGroup) menu.getChildAt(i)).getChildAt(0) : null;
                if (opening) {
                    if (label != null) label.setVisibility(View.VISIBLE);
                    item.setVisibility(View.VISIBLE);
                    item.setAlpha(0f);
                    item.setTranslationY(18f);
                    item.animate().alpha(1f).translationY(0f).setDuration(140L + i * 25L).start();
                } else {
                    if (label != null) label.setVisibility(View.GONE);
                    item.animate().alpha(0f).translationY(18f).setDuration(100L).withEndAction(() -> item.setVisibility(View.GONE)).start();
                }
            }
        });'''
          if old_tools not in m:
              raise SystemExit('tools block not found; refusing partial patch')
          m = m.replace(old_tools, new_tools, 1)
          main.write_text(m)

          icon = Path('app/src/main/res/drawable/ic_run.xml')
          if not icon.exists():
              icon.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="@color/icon_tint" android:pathData="M8,5v14l11,-7z"/>\n</vector>\n''')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','app/src/main/res/layout/activity_main.xml','app/src/main/java/com/ghostlock/app/MainActivity.java','app/src/main/res/drawable/ic_run.xml'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              raise SystemExit(0)
          subprocess.run(['git','commit','-m','fix: apply device reported UI corrections'],check=True)
          subprocess.run(['git','push','origin','HEAD:Test'],check=True)
