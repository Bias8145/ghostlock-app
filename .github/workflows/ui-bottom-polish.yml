name: UI Bottom Polish

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Patch bottom UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout = Path('app/src/main/res/layout/activity_main.xml')
          s = layout.read_text()
          old = 'android:id="@+id/bottomNav" android:layout_width="match_parent" android:layout_height="72dp" android:background="@color/surface_container_low"'
          new = 'android:id="@+id/bottomNav" android:layout_width="match_parent" android:layout_height="80dp" android:layout_marginStart="12dp" android:layout_marginEnd="12dp" android:layout_marginBottom="10dp" android:background="@drawable/bg_bottom_nav" android:elevation="8dp"'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('android:paddingBottom="110dp"', 'android:paddingBottom="150dp"', 1)
          layout.write_text(s)

          # Add the floating-nav background only if the project does not already have it.
          d = Path('app/src/main/res/drawable/bg_bottom_nav.xml')
          if not d.exists():
              d.write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="@color/surface_container_low" />\n    <corners android:radius="28dp" />\n    <stroke android:width="1dp" android:color="@color/outline_variant" />\n</shape>\n''')
          PY
      - name: Commit UI polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/layout/activity_main.xml app/src/main/res/drawable/bg_bottom_nav.xml
          git diff --cached --quiet && exit 0
          git commit -m "ui: polish floating bottom navigation and log spacing"
          git push origin HEAD:Test
