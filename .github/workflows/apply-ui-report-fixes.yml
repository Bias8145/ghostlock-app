name: Apply UI Report Fixes

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0

      - name: Remove duplicate XML attributes safely
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          layout = Path('app/src/main/res/layout/activity_main.xml')
          x = layout.read_text()
          cleaned = re.sub(r'\s+android:visibility="gone"(?:\s+android:visibility="gone")+', ' android:visibility="gone"', x)
          if cleaned == x:
              print('No duplicate visibility attributes found')
              raise SystemExit(0)
          layout.write_text(cleaned)

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', str(layout)], check=True)
          subprocess.run(['git','commit','-m','fix: clean duplicate XML visibility attributes'], check=True)
          subprocess.run(['git','push','origin','HEAD:Test'], check=True)
