name: Apply UI Report Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0

      - name: Apply reported UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          layout = Path('app/src/main/res/layout/activity_main.xml')
          x = layout.read_text()
          x = re.sub(r'\s+android:visibility="gone"(?:\s+android:visibility="gone")+', ' android:visibility="gone"', x)
          layout.write_text(x)

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', str(layout)], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              print('No source changes required')
              raise SystemExit(0)
          subprocess.run(['git','commit','-m','fix: clean duplicate layout attributes'], check=True)
          subprocess.run(['git','push','origin','HEAD:Test'], check=True)
