name: Apply Final UI Revisions
on:
  push:
    branches: [Test]
    paths-ignore:
      - '.github/workflows/final_ui_apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Apply final UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xml_path = Path('app/src/main/res/layout/activity_main.xml')
          xml = xml_path.read_text()

          # 7. Extend the log panel without consuming the bottom navigation.
          xml = xml.replace('android:layout_height="520dp" android:layout_marginBottom="12dp" app:cardBackgroundColor="@color/log_bg"',
                            'android:layout_height="600dp" android:layout_marginBottom="12dp" app:cardBackgroundColor="@color/log_bg"', 1)

          # 8. Theme icon: slightly larger and lifted.
          xml = xml.replace('android:id="@+id/headerThemeToggle" android:layout_width="52dp" android:layout_height="52dp" android:layout_marginStart="6dp"',
                            'android:id="@+id/headerThemeToggle" android:layout_width="58dp" android:layout_height="58dp" android:layout_marginStart="6dp" android:layout_marginTop="-4dp"', 1)

          # 2. Softer floating-tools shadow in light theme.
          xml = xml.replace('android:id="@+id/toolsFab" android:layout_width="52dp" android:layout_height="52dp" android:background="@drawable/bg_fab"',
                            'android:id="@+id/toolsFab" android:layout_width="52dp" android:layout_height="52dp" android:background="@drawable/bg_fab"', 1)
          xml = xml.replace('android:elevation="12dp"/>', 'android:elevation="4dp"/>', 1)

          # 1. Remove the old full-width Run button outside the log card.
          run_re = re.compile(r'\s*<com\.google\.android\.material\.button\.MaterialButton android:id="@\+id/runButton".*?/>')
          xml, removed = run_re.subn('', xml, count=1)
          if removed != 1:
              raise SystemExit('runButton outside panel not found')

          # Put Tools higher and Run directly below it, both inside the log FrameLayout.
          tools_id = xml.index('android:id="@+id/toolsFabMenu"')
          suffix = xml[tools_id:]
          marker = '</LinearLayout>\n                    </FrameLayout>'
          p = suffix.find(marker)
          if p < 0:
              raise SystemExit('tools menu closing marker not found')
          absolute = tools_id + p
          run = ('<com.google.android.material.button.MaterialButton android:id="@+id/runButton" '
                 'android:layout_width="148dp" android:layout_height="62dp" '
                 'android:layout_gravity="end|bottom" android:layout_marginEnd="4dp" '
                 'android:layout_marginBottom="8dp" android:text="Run" android:textAllCaps="false" '
                 'android:elevation="4dp" app:icon="@drawable/ic_run" app:iconGravity="textStart" '
                 'app:iconPadding="10dp" app:iconSize="22dp" app:iconTint="@color/on_accent" '
                 'app:cornerRadius="18dp"/>')
          xml = xml[:absolute] + xml[absolute:].replace('</LinearLayout>\n                    </FrameLayout>',
                  '</LinearLayout>\n' + '                    ' + run + '\n                    </FrameLayout>', 1)
          # Tools sits immediately above Run.
          xml = xml.replace('android:id="@+id/toolsFabMenu" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="end|bottom" android:layout_marginEnd="4dp" android:layout_marginBottom="8dp"',
                            'android:id="@+id/toolsFabMenu" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="end|bottom" android:layout_marginEnd="4dp" android:layout_marginBottom="82dp"', 1)

          # 4. One continuous navbar surface; child buttons have no individual cards.
          xml = xml.replace('android:id="@+id/bottomNav" android:layout_width="match_parent" android:layout_height="64dp" android:orientation="horizontal" android:gravity="center" android:paddingStart="8dp" android:paddingEnd="8dp" android:paddingTop="4dp" android:paddingBottom="4dp" android:background="@color/bg"',
                            'android:id="@+id/bottomNav" android:layout_width="match_parent" android:layout_height="64dp" android:orientation="horizontal" android:gravity="center" android:paddingStart="8dp" android:paddingEnd="8dp" android:paddingTop="4dp" android:paddingBottom="4dp" android:background="@drawable/bg_bottom_nav"', 1)
          xml = xml.replace('app:cornerRadius="16dp"/>', 'app:cornerRadius="0dp" app:backgroundTint="@android:color/transparent"/>')
          xml_path.write_text(xml)

          # 3 + 5 + 6: Java behavior.
          java_path = Path('app/src/main/java/com/ghostlock/app/MainActivity.java')
          java = java_path.read_text()

          old_listener = 'runButton.setOnClickListener(v -> startExploit());'
          new_listener = '''runButton.setOnClickListener(v -> {\n            if (!hasKsuManagerInstalled()) {\n                appendLog("error: no KernelSU-compatible manager installed");\n                toast(R.string.run_manager_required);\n                return;\n            }\n            startExploit();\n        });'''
          if old_listener not in java:
              raise SystemExit('run listener not found')
          java = java.replace(old_listener, new_listener, 1)

          helper = '''\n    private boolean hasKsuManagerInstalled() {\n        PackageManager pm = getPackageManager();\n        for (String pkg : KSU_MANAGER_PACKAGES) {\n            try {\n                pm.getApplicationInfo(pkg, 0);\n                return true;\n            } catch (PackageManager.NameNotFoundException ignored) {\n            }\n        }\n        return false;\n    }\n'''
          anchor = '    private void startExploit() {'
          if anchor not in java:
              raise SystemExit('startExploit anchor not found')
          java = java.replace(anchor, helper + '\n' + anchor, 1)

          # Blur the content underneath the expanded tool menu.
          java = java.replace('''            toolsFab.setImageResource(opening ? R.drawable.ic_close : R.drawable.ic_tools);\n            for (int i = 0; i < toolItems.length; i++) {''',
                              '''            toolsFab.setImageResource(opening ? R.drawable.ic_close : R.drawable.ic_tools);\n            setPanelBlur(opening);\n            for (int i = 0; i < toolItems.length; i++) {''', 1)

          # 6. Keep Clear History fixed to the history page instead of scrolling with content.
          java = java.replace('        historyBody.addView(clear);\n        historyScroll.addView(historyBody);\n        pageHost.addView(historyScroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));',
                              '''        historyScroll.addView(historyBody);\n        pageHost.addView(historyScroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n        FrameLayout.LayoutParams clearLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(48));\n        clearLp.gravity = android.view.Gravity.END | android.view.Gravity.BOTTOM;\n        clearLp.setMargins(0, 0, dp(16), dp(16));\n        clear.setLayoutParams(clearLp);\n        clear.setElevation(dp(4));\n        pageHost.addView(clear);''', 1)

          java_path.write_text(java)
          PY

          cat > app/src/main/res/drawable/bg_bottom_nav.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/surface_container_low" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          # 5. Add the manager-required message only if it is not already present.
          if ! grep -q 'run_manager_required' app/src/main/res/values/strings.xml; then
            python3 - <<'PY2'
          from pathlib import Path
          p=Path('app/src/main/res/values/strings.xml')
          s=p.read_text()
          marker='</resources>'
          s=s.replace(marker, '    <string name="run_manager_required">Install KernelSU, ReSukiSU, or KoWSU Manager before running.</string>\n'+marker, 1)
          p.write_text(s)
          PY2
          fi

          # Do not leave the one-shot workflow in the final tree.
          rm -f .github/workflows/final_ui_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout/activity_main.xml app/src/main/java/com/ghostlock/app/MainActivity.java app/src/main/res/drawable/bg_bottom_nav.xml app/src/main/res/values/strings.xml .github/workflows/final_ui_apply.yml
          git commit -m 'feat: finalize log tools and navigation UI'
          git push origin HEAD:Test