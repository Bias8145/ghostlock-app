name: UI final build
on:
  push:
    branches: [Test]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: Test
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}
      - name: Test extractor
        working-directory: tools/extract_rs
        run: cargo test --release
      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-r30.1-linux
      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/r30.1/ondk-r30.1-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"
      - name: Link ONDK
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"
      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-ui-final
          path: app/build/outputs/apk/release/*.apk
          archive: false
