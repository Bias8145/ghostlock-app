name: UI Layout Polish
on:
  push:
    branches: [Test]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/res/layout/activity_main.xml')
          s=p.read_text()
          s=s.replace('android:paddingStart="16dp" android:paddingTop="20dp" android:paddingEnd="16dp" android:paddingBottom="16dp"', 'android:paddingStart="12dp" android:paddingTop="20dp" android:paddingEnd="12dp" android:paddingBottom="16dp"')
          marker='        <com.ghostlock.app.CollapsibleToolsLayout android:visibility="gone" android:layout_width="1dp" android:layout_height="1dp">'
          hidden='''        <com.google.android.material.button.MaterialButton android:id="@+id/otaButton" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />\n        <com.google.android.material.button.MaterialButton android:id="@+id/parseButton" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />\n        <com.google.android.material.button.MaterialButton android:id="@+id/exportButton" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />\n'''
          if marker in s and 'android:id="@+id/otaButton"' not in s:
              s=s.replace(marker, hidden+marker)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/res/layout/activity_main.xml
          git diff --cached --quiet || git commit -m 'ui: tighten content insets and preserve tool actions'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/ui-layout-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github/workflows/ui-layout-polish.yml
          git diff --cached --quiet || git commit -m 'chore: remove temporary UI polish workflow'
          git push || true