name: UI final patch
on:
  push:
    branches: [Test]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Apply UI patch
        run: python3 .github/ui_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostlock/app/MainActivity.java app/src/main/res/drawable/ic_nav_home.xml app/src/main/res/drawable/ic_nav_history.xml app/src/main/res/drawable/ic_nav_settings.xml
          git diff --cached --quiet || git commit -m "ui: finalize pages history navigation and layout"
          git push origin Test
          rm -f .github/ui_patch.py .github/workflows/ui-final-patch.yml
          git add -A .github
          git commit -m "chore: remove temporary UI patch files" || true
          git push origin Test || true
