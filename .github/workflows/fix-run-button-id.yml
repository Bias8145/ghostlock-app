name: Fix Run Button ID

on:
  workflow_dispatch:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test
          fetch-depth: 0
      - name: Restore Run view ID required by MainActivity
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/res/layout/activity_main.xml')
          s = p.read_text()
          if '@+id/runButton' not in s:
              marker = '        <com.google.android.material.button.MaterialButton android:id="@+id/otaButton"'
              button = '        <com.google.android.material.button.MaterialButton android:id="@+id/runButton" android:layout_width="1dp" android:layout_height="1dp" android:visibility="gone" />\n'
              if marker not in s:
                  raise SystemExit('Cannot locate stable insertion point for runButton')
              s = s.replace(marker, button + marker, 1)
              p.write_text(s)
          else:
              print('runButton already present')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/layout/activity_main.xml
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore run button resource id"
          git push origin HEAD:Test
